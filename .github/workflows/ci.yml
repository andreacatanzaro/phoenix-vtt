name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test, typecheck, lint, copertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The pnpm version comes from "packageManager" in package.json; the Node version from .nvmrc.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm coverage:check

  image:
    name: Immagine di produzione
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (senza pubblicare)
        run: docker build --target prod --tag phoenix-vtt:ci .
